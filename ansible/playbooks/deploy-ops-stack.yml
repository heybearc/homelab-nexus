---
# Ops Hub stack — Netbox + Technitium DNS + NPM (CT202 @ 10.92.3.83)
#
# Container may already exist (bootstrap-ops-stack.sh). This playbook registers
# inventory in Netbox and ensures internal DNS + NPM match the standard pattern.
#
#   cd /Users/cory/Projects/homelab-nexus
#   set -a && source .env && set +a
#   cd ansible && ansible-playbook playbooks/deploy-ops-stack.yml

- name: Deploy Ops Hub stack (post-config)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/ops_stack_deploy.yml
  tasks:
    - name: Require Netbox, NPM, and Technitium credentials
      ansible.builtin.assert:
        that:
          - netbox_token | length > 0
          - npm_password | length > 0
          - technitium_api_token | length > 8
        fail_msg: "Set NETBOX_TOKEN, NPM_PASSWORD, and TECHNITIUM_API_TOKEN in homelab-nexus/.env"

    - name: Show deployment plan
      ansible.builtin.debug:
        msg:
          - "Ops stack CT{{ ops_stack_ctid }} {{ ops_stack_name }} @ {{ ops_stack_ip }}/24"
          - "Technitium A: {{ ops_stack_domain }} → {{ ops_stack_dns_target_ip }} (NPM)"
          - "Technitium A: {{ ops_stack_ntfy_domain }} → {{ ops_stack_dns_target_ip }} (NPM)"
          - "NPM: {{ ops_stack_domain }} → {{ ops_stack_ip }}:{{ ops_stack_port }}"
          - "NPM: {{ ops_stack_ntfy_domain }} → {{ ops_stack_ip }}:{{ ops_ntfy_port }}"

    - name: Verify CT{{ ops_stack_ctid }} exists on Proxmox
      ansible.builtin.command: >
        ssh -F {{ homelab_ssh_config }} prox
        "test -f /etc/pve/lxc/{{ ops_stack_ctid }}.conf"
      changed_when: false

    - name: Register in Netbox
      ansible.builtin.include_tasks: tasks/netbox-register-container.yml
      vars:
        nb_container_name: "{{ ops_stack_name }}"
        nb_ctid: "{{ ops_stack_ctid }}"
        nb_ip: "{{ ops_stack_ip }}"
        nb_function: "{{ ops_stack_function }}"
        nb_cores: "{{ ops_stack_cores }}"
        nb_memory: "{{ ops_stack_memory }}"
        nb_disk: "{{ ops_stack_disk }}"
        nb_netbox_comment: >-
          Ops Hub | {{ ops_stack_domain }} + {{ ops_stack_ntfy_domain }} |
          ops-hub:{{ ops_stack_port }} ops-sync:{{ ops_sync_port }} ntfy:{{ ops_ntfy_port }} |
          CT{{ ops_stack_ctid }}
        nb_ip_description: "LXC CT{{ ops_stack_ctid }} ops-stack"

    - name: Configure Technitium DNS
      ansible.builtin.include_tasks: tasks/configure-ops-stack-dns.yml

    - name: Configure NPM reverse proxies
      ansible.builtin.include_tasks: tasks/configure-ops-stack-npm.yml

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "SSH: ssh ops-stack  (root@{{ ops_stack_ip }})"
          - "Direct: http://{{ ops_stack_ip }}:{{ ops_stack_port }}"
          - "Public: https://{{ ops_stack_domain }}"
          - "ntfy: https://{{ ops_stack_ntfy_domain }} (topic {{ ops_ntfy_topic }})"
          - "Apple calendar ICS: https://{{ ops_stack_domain }}/api/calendar/ics"
