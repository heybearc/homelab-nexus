---
- name: Render HAProxy fragments for HHV
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ../templates/hhv-haproxy-frontend.cfg.j2, dest: /tmp/hhv-haproxy-frontend.cfg }
    - { src: ../templates/hhv-haproxy-backend.cfg.j2, dest: /tmp/hhv-haproxy-backend.cfg }

- name: Check if HHV backends already exist
  ansible.builtin.shell: |
    ssh -F {{ homelab_ssh_config }} haproxy "grep -q 'backend hhv-blue' /etc/haproxy/haproxy.cfg"
  register: haproxy_hhv_exists
  changed_when: false
  failed_when: false

- name: Install HHV HAProxy blocks
  when: haproxy_hhv_exists.rc != 0
  block:
    - name: Copy fragments to HAProxy container
      shell: |
        scp -F {{ homelab_ssh_config }} /tmp/hhv-haproxy-frontend.cfg prox:/tmp/hhv-frontend.cfg
        scp -F {{ homelab_ssh_config }} /tmp/hhv-haproxy-backend.cfg prox:/tmp/hhv-backend.cfg
        ssh -F {{ homelab_ssh_config }} prox "pct push 136 /tmp/hhv-frontend.cfg /tmp/hhv-frontend.cfg && pct push 136 /tmp/hhv-backend.cfg /tmp/hhv-backend.cfg"

    - name: Insert ACLs and routing in frontend
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- python3 - <<'PY'
        from pathlib import Path
        cfg = Path('/etc/haproxy/haproxy.cfg')
        text = cfg.read_text()
        fe = Path('/tmp/hhv-frontend.cfg').read_text().strip() + '\n'
        acl_marker = 'acl is_chapter_hub hdr(host) -i hub.cloudigan.net'
        if 'is_hhv' not in text:
            if acl_marker not in text:
                acl_marker = 'acl is_cloudigan_mail hdr(host) -i mail.cloudigan.net'
            acl_lines = '\n'.join(l for l in fe.splitlines() if 'acl is_hhv' in l) + '\n'
            text = text.replace(acl_marker, acl_marker + '\n' + acl_lines, 1)
        route_marker = '    use_backend chapter-hub-blue if is_chapter_hub'
        if 'use_backend hhv-blue if is_hhv' not in text:
            if route_marker not in text:
                route_marker = '    use_backend cloudigan-mail-blue if is_cloudigan_mail'
            route_lines = '\n'.join(l for l in fe.splitlines() if l.strip().startswith('use_backend hhv')) + '\n'
            text = text.replace(route_marker, route_lines + route_marker + '\n', 1)
        cfg.write_text(text)
        print('frontend ok')
        PY"

    - name: Insert backends before cloudigan-mail section
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- python3 - <<'PY'
        from pathlib import Path
        cfg = Path('/etc/haproxy/haproxy.cfg')
        text = cfg.read_text()
        be = Path('/tmp/hhv-backend.cfg').read_text().strip() + '\n\n'
        if '\nbackend hhv-blue\n' in text:
            print('backends exist')
            raise SystemExit(0)
        marker = '# Cloudigan Mail Gateway — mail.cloudigan.net'
        if marker not in text:
            raise SystemExit('insert marker not found')
        cfg.write_text(text.replace(marker, be + marker, 1))
        print('backends ok')
        PY"

    - name: Validate and reload HAProxy
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- bash -c 'haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy'"

- name: Initialize HHV deployment state (BLUE LIVE)
  shell: |
    ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- bash -c '
      echo \"{\\\"prod\\\":\\\"blue\\\",\\\"live\\\":\\\"blue\\\",\\\"standby\\\":\\\"green\\\",\\\"switchCount\\\":0}\" > /var/lib/haproxy/hhv-deployment-state.json
    '"
  changed_when: true
