---
- name: Install the Leantime MySQL backup script on the Proxmox node
  ansible.builtin.shell: |
    set -euo pipefail
    ssh -F {{ homelab_ssh_config }} {{ leantime_node }} 'cat > /usr/local/bin/backup-leantime-mysql.sh && chmod 755 /usr/local/bin/backup-leantime-mysql.sh' <<'SCRIPT'
    #!/bin/bash
    # Daily logical dump of the Leantime MySQL database on CT{{ leantime_ctid }}.
    # Lands beside the Postgres dumps. Container snapshots are not the database copy.
    set -euo pipefail
    DEST=/mnt/pve/truenas-backups/database
    STAMP=$(date +%Y%m%d-%H%M%S)
    OUT="$DEST/leantime-$STAMP.sql.gz"
    mkdir -p "$DEST"
    pct exec {{ leantime_ctid }} -- docker exec mysql_leantime \
      sh -c 'exec mysqldump --single-transaction --routines --no-tablespaces -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
      | gzip > "$OUT"
    find "$DEST" -name 'leantime-*.sql.gz' -mtime +14 -delete
    echo "$(date -Is) $OUT" >> /var/log/leantime-backup.log
    SCRIPT
  args:
    executable: /bin/bash
  changed_when: true

- name: Schedule the Leantime dump at 1:10 AM
  ansible.builtin.shell: |
    set -euo pipefail
    ssh -F {{ homelab_ssh_config }} {{ leantime_node }} 'cat > /etc/cron.d/leantime-mysql-backup' <<'CRON'
    # Daily Leantime MySQL dump, after the 1:00 AM Postgres job starts.
    10 1 * * * root /usr/local/bin/backup-leantime-mysql.sh
    CRON
    ssh -F {{ homelab_ssh_config }} {{ leantime_node }} 'chmod 644 /etc/cron.d/leantime-mysql-backup'
  args:
    executable: /bin/bash
  changed_when: true
