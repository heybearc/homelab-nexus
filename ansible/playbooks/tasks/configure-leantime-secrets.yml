---
- name: Ensure the secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../secrets"
    state: directory
    mode: "0700"

- name: Generate Leantime secrets once
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ leantime_secrets_file }}"
    if [ -f "$f" ]; then
      exit 0
    fi
    umask 077
    cat > "$f" <<EOF
    leantime_mysql_root_password: "$(openssl rand -hex 24)"
    leantime_mysql_password: "$(openssl rand -hex 24)"
    leantime_session_password: "$(openssl rand -hex 32)"
    EOF
  args:
    executable: /bin/bash
  no_log: true

- name: Load Leantime secrets
  ansible.builtin.include_vars: "{{ leantime_secrets_file }}"
