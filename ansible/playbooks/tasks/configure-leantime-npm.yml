---
- name: Login to Nginx Proxy Manager
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/tokens"
    method: POST
    body_format: json
    body:
      identity: "{{ npm_email }}"
      secret: "{{ npm_password }}"
    status_code: [200]
    return_content: true
  register: npm_login
  no_log: true

- name: List NPM proxy hosts
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_login.json.token }}"
    return_content: true
    status_code: [200]
  register: npm_hosts
  no_log: true

- name: Find the work.cloudigan.net proxy
  ansible.builtin.set_fact:
    leantime_npm_existing: "{{ npm_hosts.json | selectattr('domain_names', 'contains', leantime_domain) | list }}"

- name: Create the NPM proxy host
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts"
    method: POST
    headers:
      Authorization: "Bearer {{ npm_login.json.token }}"
    body_format: json
    body:
      domain_names: ["{{ leantime_domain }}"]
      forward_scheme: http
      forward_host: "{{ leantime_ip }}"
      forward_port: "{{ leantime_port | int }}"
      access_list_id: 0
      certificate_id: 0
      ssl_forced: false
      caching_enabled: false
      block_exploits: true
      allow_websocket_upgrade: true
      http2_support: true
      enabled: true
      meta:
        letsencrypt_agree: true
        dns_challenge: false
    status_code: [201]
    return_content: true
  register: npm_create
  when: leantime_npm_existing | length == 0

- name: Remember the proxy id
  ansible.builtin.set_fact:
    leantime_npm_id: "{{ (npm_create.json.id if (leantime_npm_existing | length == 0) else leantime_npm_existing[0].id) }}"
    leantime_npm_cert_id: "{{ (leantime_npm_existing[0].certificate_id | default(0) | int) if (leantime_npm_existing | length > 0) else 0 }}"

- name: Request a Let's Encrypt certificate
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/certificates"
    method: POST
    headers:
      Authorization: "Bearer {{ npm_login.json.token }}"
    body_format: json
    body:
      provider: letsencrypt
      domain_names: ["{{ leantime_domain }}"]
      meta:
        dns_challenge: false
    status_code: [200, 201]
    return_content: true
  register: npm_cert
  failed_when: false
  when:
    - npm_ssl | bool
    - leantime_npm_cert_id | int == 0

- name: Choose the certificate id
  ansible.builtin.set_fact:
    leantime_cert_id: "{{ (npm_cert.json.id | default(leantime_npm_cert_id)) | int }}"

- name: Point the proxy at Leantime
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts/{{ leantime_npm_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ npm_login.json.token }}"
    body_format: json
    body:
      domain_names: ["{{ leantime_domain }}"]
      forward_scheme: http
      forward_host: "{{ leantime_ip }}"
      forward_port: "{{ leantime_port | int }}"
      certificate_id: "{{ leantime_cert_id | int }}"
      ssl_forced: "{{ (leantime_cert_id | int) > 0 }}"
      allow_websocket_upgrade: true
      http2_support: true
      enabled: true
      block_exploits: true
    status_code: [200]
