---
- name: Login to Nginx Proxy Manager
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/tokens"
    method: POST
    body_format: json
    body:
      identity: "{{ npm_email }}"
      secret: "{{ npm_password }}"
    status_code: [200]
    return_content: true
  register: ops_npm_login
  no_log: true
  delegate_to: localhost

- name: List existing NPM proxy hosts
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ ops_npm_login.json.token }}"
    return_content: true
    status_code: [200]
  register: ops_npm_hosts
  no_log: true
  delegate_to: localhost

- name: Configure NPM proxy for {{ ops_npm_domain }}
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts"
    method: POST
    headers:
      Authorization: "Bearer {{ ops_npm_login.json.token }}"
    body_format: json
    body:
      domain_names: ["{{ ops_npm_domain }}"]
      forward_scheme: http
      forward_host: "{{ ops_stack_ip }}"
      forward_port: "{{ ops_npm_forward_port | int }}"
      access_list_id: 0
      certificate_id: 0
      ssl_forced: false
      caching_enabled: false
      block_exploits: true
      allow_websocket_upgrade: true
      http2_support: true
      hsts_enabled: false
      hsts_subdomains: false
      meta:
        letsencrypt_agree: true
        dns_challenge: false
    status_code: [201]
    return_content: true
  register: ops_npm_create
  when: ops_npm_hosts.json | selectattr('domain_names', 'contains', ops_npm_domain) | list | length == 0
  delegate_to: localhost

- name: Resolve NPM proxy id for {{ ops_npm_domain }}
  ansible.builtin.set_fact:
    ops_npm_proxy_id: >-
      {{
        ops_npm_create.json.id
        if (ops_npm_create is defined and ops_npm_create.json.id is defined)
        else (ops_npm_hosts.json | selectattr('domain_names', 'contains', ops_npm_domain) | map(attribute='id') | first)
      }}

- name: Request Let's Encrypt cert for {{ ops_npm_domain }}
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/certificates"
    method: POST
    headers:
      Authorization: "Bearer {{ ops_npm_login.json.token }}"
    body_format: json
    body:
      provider: letsencrypt
      domain_names: ["{{ ops_npm_domain }}"]
      meta:
        letsencrypt_email: "{{ npm_email }}"
        letsencrypt_agree: true
        dns_challenge: false
    status_code: [200, 201]
    return_content: true
  register: ops_npm_cert
  failed_when: false
  when: npm_ssl | bool
  delegate_to: localhost

- name: Attach SSL cert to {{ ops_npm_domain }} proxy
  ansible.builtin.uri:
    url: "{{ npm_url }}/api/nginx/proxy-hosts/{{ ops_npm_proxy_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ ops_npm_login.json.token }}"
    body_format: json
    body:
      domain_names: ["{{ ops_npm_domain }}"]
      forward_scheme: http
      forward_host: "{{ ops_stack_ip }}"
      forward_port: "{{ ops_npm_forward_port | int }}"
      certificate_id: "{{ ops_npm_cert.json.id }}"
      ssl_forced: true
      allow_websocket_upgrade: true
      http2_support: true
    status_code: [200]
  when:
    - npm_ssl | bool
    - ops_npm_cert.status | default(0) in [200, 201]
    - ops_npm_cert.json.id is defined
  delegate_to: localhost
