---
- name: Render HAProxy fragments
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ../templates/cloudigan-mail-haproxy-frontend.cfg.j2, dest: /tmp/cloudigan-mail-haproxy-frontend.cfg }
    - { src: ../templates/cloudigan-mail-haproxy-backend.cfg.j2, dest: /tmp/cloudigan-mail-haproxy-backend.cfg }

- name: Check if cloudigan-mail backends exist
  ansible.builtin.shell: |
    ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- grep -q 'backend cloudigan-mail-blue' /etc/haproxy/haproxy.cfg"
  register: haproxy_cm_exists
  changed_when: false
  failed_when: false

- name: Install cloudigan-mail HAProxy blocks
  when: haproxy_cm_exists.rc != 0
  block:
    - name: Copy fragments to HAProxy container
      shell: |
        scp -F {{ homelab_ssh_config }} /tmp/cloudigan-mail-haproxy-frontend.cfg prox:/tmp/cm-frontend.cfg
        scp -F {{ homelab_ssh_config }} /tmp/cloudigan-mail-haproxy-backend.cfg prox:/tmp/cm-backend.cfg
        ssh -F {{ homelab_ssh_config }} prox "pct push 136 /tmp/cm-frontend.cfg /tmp/cm-frontend.cfg && pct push 136 /tmp/cm-backend.cfg /tmp/cm-backend.cfg"

    - name: Insert ACLs and routing in frontend
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- python3 - <<'PY'
        from pathlib import Path
        cfg = Path('/etc/haproxy/haproxy.cfg')
        text = cfg.read_text()
        fe = Path('/tmp/cm-frontend.cfg').read_text().strip() + '\n'
        acl_marker = 'acl is_chapter_hub hdr(host) -i hub.cloudigan.net'
        route_marker = '    use_backend chapter-hub-blue if is_chapter_hub'
        if 'is_cloudigan_mail' not in text:
            acl_lines = '\n'.join(l for l in fe.splitlines() if 'acl is_cloudigan_mail' in l) + '\n'
            if acl_marker in text:
                text = text.replace(acl_marker, acl_marker + '\n' + acl_lines, 1)
            else:
                raise SystemExit('chapter-hub acl marker missing')
        if 'use_backend cloudigan-mail-blue if is_cloudigan_mail' not in text:
            route_lines = '\n'.join(l for l in fe.splitlines() if l.strip().startswith('use_backend cloudigan-mail')) + '\n'
            if route_marker in text:
                text = text.replace(route_marker, route_lines + route_marker + '\n', 1)
            else:
                raise SystemExit('chapter-hub route marker missing')
        cfg.write_text(text)
        print('frontend ok')
        PY"

    - name: Insert backends after chapter-hub-green
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- python3 - <<'PY'
        from pathlib import Path
        cfg = Path('/etc/haproxy/haproxy.cfg')
        text = cfg.read_text()
        be = Path('/tmp/cm-backend.cfg').read_text().strip() + '\n\n'
        if '\nbackend cloudigan-mail-blue\n' in text:
            print('backends exist')
            raise SystemExit(0)
        insert_marker = '\n\n# Cloudigan API'
        idx = text.find(insert_marker)
        if idx < 0:
            idx = text.find('\n\n# BNI Chapter Toolkit')
        if idx < 0:
            raise SystemExit('mail backend insert point not found')
        cfg.write_text(text[:idx] + '\n\n' + be + text[idx:])
        print('backends ok')
        PY"

    - name: Validate and reload HAProxy
      shell: |
        ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- bash -c 'haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy'"

- name: Initialize cloudigan-mail deployment state (BLUE LIVE)
  shell: |
    ssh -F {{ homelab_ssh_config }} prox "pct exec 136 -- bash -c '
      echo \"{\\\"prod\\\":\\\"blue\\\",\\\"live\\\":\\\"blue\\\",\\\"standby\\\":\\\"green\\\",\\\"switchCount\\\":0}\" > /var/lib/haproxy/cloudigan-mail-deployment-state.json
    '"
  changed_when: true
