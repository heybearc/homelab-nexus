---
- name: Ensure the secrets directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../secrets"
    state: directory
    mode: "0700"

- name: Generate Documenso secrets once
  ansible.builtin.shell: |
    set -euo pipefail
    f="{{ documenso_secrets_file }}"
    if [ -f "$f" ]; then
      exit 0
    fi
    umask 077
    cat > "$f" <<EOF
    documenso_db_password: "$(openssl rand -hex 24)"
    documenso_nextauth_secret: "$(openssl rand -hex 32)"
    documenso_encryption_key: "$(openssl rand -hex 32)"
    documenso_encryption_secondary_key: "$(openssl rand -hex 32)"
    documenso_cert_passphrase: "$(openssl rand -hex 16)"
    EOF
  args:
    executable: /bin/bash
  no_log: true

- name: Load Documenso secrets
  ansible.builtin.include_vars: "{{ documenso_secrets_file }}"
