# network interface settings; autogenerated
# Please do NOT modify this file directly, unless you know what
# you're doing.
#
# If you want to manage parts of the network configuration manually,
# please utilize the 'source' or 'source-directory' directives to do
# so.
# PVE will preserve these directives, but will NOT read its network
# configuration from sourced files, so do not attempt to move any of
# the PVE managed interfaces into external files!

auto lo
iface lo inet loopback

iface eno1 inet manual
# VLAN trunk: native 920 on vmbr0; 923-925 moved to 10G guest trunk

auto vmbr0
iface vmbr0 inet static
	address 10.92.0.6/23
	gateway 10.92.0.1
	bridge-ports eno1
	bridge-stp off
	bridge-fd 0

iface eno2 inet manual

iface eno3 inet manual

iface eno4 inet manual

auto enp4s0f0
iface enp4s0f0 inet manual
	mtu 9000

auto enp4s0f1
iface enp4s0f1 inet manual
	mtu 9000
#10G guest trunk, SX3016F

auto vmbr0922
iface vmbr0922 inet static
	address 10.92.2.6/24
	bridge-ports enp4s0f0.922
	bridge-stp off
	bridge-fd 0
	mtu 9000
# storage VLAN via SX3016F — NFS test to TrueNAS 10.92.2.200

auto vmbr0923
iface vmbr0923 inet static
	address 10.92.3.206/24
	bridge-ports enp4s0f1.923
	bridge-stp off
	bridge-fd 0
# host VLAN 923 via 10G guest trunk — no gateway (mgmt default remains vmbr0)

auto vmbr0924
iface vmbr0924 inet manual
	bridge-ports enp4s0f1.924
	bridge-stp off
	bridge-fd 0

auto vmbr0925
iface vmbr0925 inet manual
	bridge-ports enp4s0f1.925
	bridge-stp off
	bridge-fd 0
	mtu 1500

# Same L2 as vmbr0 (native VLAN 920) so existing vmbr920 guests keep their net0
auto vmbr920
iface vmbr920 inet manual
	bridge-ports none
	bridge-stp off
	bridge-fd 0
	post-up ip link add veth920a type veth peer name veth920b || true
	post-up ip link set veth920a master vmbr920 || true
	post-up ip link set veth920b master vmbr0 || true
	post-up ip link set veth920a up
	post-up ip link set veth920b up

source /etc/network/interfaces.d/*
